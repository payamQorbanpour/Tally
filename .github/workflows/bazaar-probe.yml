# Throwaway diagnostic: does a GitHub runner reach the Pishkhan API, and is
# BAZAAR_API_TOKEN actually set here? Costs seconds, builds nothing.
# Delete once the release pipeline is green.
name: Bazaar API probe

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reach Pishkhan from the runner
        env:
          BAZAAR_TOKEN: ${{ secrets.BAZAAR_API_TOKEN }}
        run: |
          set -uo pipefail
          api="https://api.pishkhan.cafebazaar.ir/v1/apps/releases/last-uncommitted/"
          token=$(printf '%s' "${BAZAAR_TOKEN:-}" | tr -d '[:space:]')

          echo "secret set:    $([ -n "$token" ] && echo yes || echo NO)"
          echo "secret length: ${#token}"
          echo "runner egress: $(curl -sS --max-time 15 https://api.ipify.org || echo unreachable)"

          # No token: proves the host is reachable at all and shows what a
          # rejection looks like from this IP.
          echo "--- unauthenticated ---"
          curl -sS -o /tmp/a -w 'status=%{http_code}\n' --max-time 25 --url "$api" \
            || echo "curl exit $? (connection refused / blocked / timed out)"
          head -c 400 /tmp/a 2>/dev/null; echo

          # With the token: 200 here means CI can publish and the original
          # failure was a stale secret; 403 here with 200 locally means the
          # runner IP is what Bazaar objects to.
          if [ -n "$token" ]; then
            echo "--- authenticated ---"
            curl -sS -o /tmp/b -w 'status=%{http_code}\n' --max-time 25 --url "$api" \
              -H "CAFEBAZAAR-PISHKHAN-API-SECRET: $token" \
              || echo "curl exit $?"
            head -c 400 /tmp/b 2>/dev/null; echo
          fi
