# Build a production Android release on EAS, then generate the Cafe Bazaar
# signature file (.bin) for the exact bundle that was built.
#
# Trigger by pushing a version tag:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# The tag must match `expo.version` in app.json — the workflow fails fast if it
# does not, so a mistyped tag never reaches a store.
#
# A tag push builds and signs, then STOPS. It does not upload.
#
# Cafe Bazaar rejects GitHub-hosted runners: Pishkhan answers every request
# from GitHub's Azure egress with 403 access_forbidden regardless of the
# token, and the response is byte-identical to an unauthenticated one, so it
# is blocking at the edge rather than refusing the credential (probe run
# 32404824716). Publishing therefore runs from a machine Bazaar accepts:
#
#   BAZAAR_API_TOKEN=... scripts/bazaar-publish.sh --submit
#
# It picks up the artifact this workflow produced. Never rebuild to publish —
# EAS builds are not reproducible and the .bin only matches the exact .aab it
# was generated from.
#
# VERSION CODES ARE MANUAL. eas.json uses `appVersionSource: local` with
# `autoIncrement: false`, so `expo.android.versionCode` in app.json is the only
# source of truth. Bump it in the same commit you tag; both stores reject a
# versionCode that was already published. The `guard` job compares it against
# the last finished EAS build and fails if it did not increase.
#
# Required repository secrets:
#   EXPO_TOKEN               expo.dev → Account Settings → Access Tokens
#   ANDROID_KEYSTORE_BASE64  base64 -i keystore.jks | pbcopy
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
#   ANDROID_KEY_ALIAS
# Retrieve the keystore four with: eas credentials -p android → Download existing keystore
#
# Store release notes are read from changelogs/<version>.fa.txt and
# changelogs/<version>.en.txt by the publish script, which refuses to submit
# if either is missing — these are user-facing, so they should not be a copy
# of the git log.

name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_bazaar:
        description: "Build only, skip generating the Bazaar .bin signature"
        type: boolean
        default: false

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  EAS_CLI: eas-cli@18.7.0
  # Pinned so a new upstream release cannot silently change signing behaviour.
  # Checksum is of the jar that produced the accepted 1.1.0 .bin.
  BUNDLESIGNER_VERSION: "0.1.13"
  BUNDLESIGNER_SHA256: "1a28844a32a16953eabe99e81400db681e844e11bb3f3bb649b8243cdd4ed3eb"

jobs:
  guard:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      version_code: ${{ steps.check.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Tag matches app.json, versionCode increased
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          version=$(jq -re '.expo.version' app.json)
          code=$(jq -re '.expo.android.versionCode' app.json)
          echo "app.json -> version=$version versionCode=$code"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag v$tag does not match app.json version $version. Bump app.json or retag."
              exit 1
            fi
          fi

          # Newest finished Android build on EAS. Tolerate failure here: a fresh
          # project with no builds should not block the first release.
          raw=$(npx --yes "$EAS_CLI" build:list --platform android --status finished \
                  --limit 1 --json --non-interactive 2>/dev/null || true)
          last=$(printf '%s' "$raw" | sed -n '/^\[/,/^\]/p' | jq -r '.[0].appBuildVersion // 0' 2>/dev/null || echo 0)
          [ -n "$last" ] || last=0
          echo "last finished build versionCode on EAS: $last"

          if [ "$last" != "0" ] && [ "$code" -le "$last" ]; then
            echo "::error::versionCode $code is not greater than the last build ($last). Bump expo.android.versionCode in app.json."
            exit 1
          fi

          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"

      # The Google Mobile Ads SDK reads these app ids at process start, before
      # any feature flag is consulted. A malformed id is a documented hard
      # crash on launch, for every user — so a placeholder must never ship.
      #
      # ...but only when the SDK is actually in the binary. This workflow builds
      # `--platform android` exclusively, and react-native.config.js currently
      # excludes react-native-google-mobile-ads from Android autolinking (see
      # the comment there). Without the native module, MobileAdsInitProvider is
      # never merged into the manifest, so nothing reads APPLICATION_ID and the
      # placeholder cannot crash anything. The AdMob config plugin still writes
      # that meta-data during prebuild, but it neither validates nor throws.
      #
      # So gate on whether the SDK ships, not on the literal string. Deleting
      # the exclusion to turn AdMob back on re-arms the placeholder check.
      - name: AdMob app ids are real
        run: |
          set -euo pipefail

          android_sdk_linked=$(node -e '
            const fs = require("fs");
            const cfg = require("./react-native.config.js");
            const a = cfg?.dependencies?.["react-native-google-mobile-ads"]?.platforms?.android;
            // Disabled either by the documented `null`, or — as this repo does,
            // to work around expo-modules-autolinking ignoring `null` — by
            // pointing sourceDir at a directory that does not exist.
            const off =
              a === null ||
              (!!a && typeof a.sourceDir === "string" && !fs.existsSync(a.sourceDir));
            process.stdout.write(off ? "no" : "yes");
          ')

          if [ "$android_sdk_linked" = "no" ]; then
            echo "Google Mobile Ads SDK is excluded from Android autolinking by react-native.config.js."
            echo "Nothing reads com.google.android.gms.ads.APPLICATION_ID in this build — a real app id is not required."
            exit 0
          fi

          if grep -q 'ca-app-pub-XXXX' app.json; then
            echo "::error::Placeholder AdMob app ID still in app.json and the SDK is linked on Android. Replace expo.plugins react-native-google-mobile-ads androidAppId/iosAppId with the real ids from the AdMob console, or keep the Android exclusion in react-native.config.js."
            exit 1
          fi
          echo "app.json AdMob app ids look real"

      # Bazaar builds ship with EXPO_PUBLIC_AD_NETWORK=tapsell, whose SDK reads
      # this key from the root `react-native-tapsell-mediation` block at build
      # time. A placeholder key means Tapsell never fills — same failure class
      # as the AdMob check above.
      - name: Tapsell app key is real
        run: |
          set -euo pipefail
          if grep -q 'REPLACE_WITH_TAPSELL_APP_KEY' app.json; then
            echo "::error::Placeholder Tapsell app key still in app.json. Replace the root react-native-tapsell-mediation.TapsellMediationAppKey with the real key from the Tapsell panel."
            exit 1
          fi
          echo "app.json Tapsell app key looks real"

  build:
    name: EAS build + Bazaar signature
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NAME: tally-${{ needs.guard.outputs.version }}-${{ needs.guard.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # bundlesigner needs Java 8+. Pinned to 8 because that is what produced
      # the .bin accepted for 1.1.0 — the Java version is recorded in the file
      # header. Moving to 17 should be fine but changes that header, so verify
      # with a test upload before switching.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - run: npm ci

      # ── Build ───────────────────────────────────────────────────────────
      # Env vars come from the EAS "production" environment, not this runner:
      # .env is gitignored and never reaches the build.
      - name: EAS build
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "$EAS_CLI" build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json | sed -n '/^\[/,/^\]/p' > build.json

          status=$(jq -re '.[0].status' build.json)
          url=$(jq -re '.[0].artifacts.applicationArchiveUrl' build.json)
          echo "status=$status"
          echo "artifact=$url"

          if [ "$status" != "FINISHED" ]; then
            echo "::error::build finished with status $status"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Download once and sign THAT file. The .bin is a digest of bundle
      # content, so it is valid only for the exact .aab uploaded beside it.
      # Never rebuild between these steps — EAS builds are not reproducible.
      - name: Download bundle
        run: |
          set -euo pipefail
          curl -fsSL -o app.aab "${{ steps.eas.outputs.url }}"
          ls -l app.aab
          unzip -l app.aab | grep -q BundleConfig.pb || { echo "::error::not a valid AAB"; exit 1; }

      # ── Bazaar signature ────────────────────────────────────────────────
      - name: Fetch bundlesigner
        if: ${{ !inputs.skip_bazaar }}
        run: |
          set -euo pipefail
          curl -fsSL -o bundlesigner.jar \
            "https://github.com/cafebazaar/bundle-signer/releases/download/v${BUNDLESIGNER_VERSION}/bundlesigner-${BUNDLESIGNER_VERSION}.jar"
          echo "${BUNDLESIGNER_SHA256}  bundlesigner.jar" | sha256sum -c -

      - name: Generate .bin
        if: ${{ !inputs.skip_bazaar }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          printf '%s' "$KEYSTORE_B64" | base64 -d > "$work/ks.jks"
          printf '%s' "$KS_PASS"  > "$work/kspass"
          printf '%s' "$KEY_PASS" > "$work/keypass"

          # Passwords go in via file: so they never reach the process list
          # or the workflow log.
          java -jar bundlesigner.jar genbin -v \
            --v2-signing-enabled true --v3-signing-enabled false \
            --bundle app.aab \
            --bin . \
            --ks "$work/ks.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "file:$work/kspass" \
            --key-pass "file:$work/keypass"

          mv "$(ls -1 ./*.bin | head -1)" "${NAME}.bin"
          ls -l ./*.bin

      - name: Verify .bin
        if: ${{ !inputs.skip_bazaar }}
        run: |
          set -euo pipefail
          head -2 "${NAME}.bin"
          grep -q 'v2:true,v3:false' "${NAME}.bin" || { echo "::error::unexpected signing scheme"; exit 1; }
          # One entry per APK split the bundle produces; 1.1.0 had 87.
          echo "APK entries: $(strings "${NAME}.bin" | grep -cE '\.apk$')"

      - name: Rename bundle
        run: mv app.aab "${NAME}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          # Both files together — Bazaar needs the pair, and the .bin is
          # worthless with any other build of the same version.
          path: |
            *.aab
            *.bin
          retention-days: 90
          if-no-files-found: error

      # ── Handoff ─────────────────────────────────────────────────────────
      # Uploading from here is not possible (see the header), so say plainly
      # what to run next instead of leaving a green build with no release.
      - name: Publish instructions
        if: ${{ !inputs.skip_bazaar }}
        run: |
          set -euo pipefail
          {
            echo "### Built and signed — not published"
            echo
            echo "Cafe Bazaar blocks GitHub-hosted runners, so publish from a machine it accepts:"
            echo
            echo '```bash'
            echo "BAZAAR_API_TOKEN=... scripts/bazaar-publish.sh --run ${GITHUB_RUN_ID} --submit"
            echo '```'
            echo
            echo "Artifact: \`${NAME}\` (.aab + .bin, 90 day retention)."
            echo "Drop \`--submit\` to upload without putting it in front of reviewers."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── TODO: submit to Google Play ─────────────────────────────────────
      # Needs a Google service account key first — the EAS credentials screen
      # shows "Submissions: Google Service Account Key for Play Store
      # Submissions — None assigned yet", and submit.production in eas.json is
      # empty. Once configured:
      #
      # - name: Submit to Play
      #   env:
      #     EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      #   run: npx --yes "$EAS_CLI" submit --platform android --profile production --non-interactive --path "${NAME}.aab"
