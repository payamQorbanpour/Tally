# https://supabase.com/docs/guides/functions
[functions.sync-apple-subscription]
verify_jwt = true

# AdMob's SSV callback arrives with no JWT — its only credential is the ECDSA
# signature, which `admobSsv.ts` checks. The /nonce and /claim routes verify
# the caller's JWT by hand inside the function.
[functions.ad-reward]
verify_jwt = false

# Grants the caller's own user id a verified pass row after Cafe Bazaar's
# Developer API confirms the purchase token; must run under a verified JWT.
[functions.verify-bazaar-purchase]
verify_jwt = true

# Returns the caller's resolved, client-visible AI config. JWT required —
# cohort resolution needs a user id, and signed-out clients fall back to
# bundled defaults by design.
[functions.get-ai-config]
verify_jwt = true

# Returns the caller's resolved config. JWT is OPTIONAL and checked by hand
# inside the function: anonymous callers get `public` keys only (first-run
# locale, plan prices, incident switches), signed-in callers additionally get
# `client` keys resolved against their cohort. Same posture as ad-reward,
# which also verifies by hand.
[functions.get-app-config]
verify_jwt = false
